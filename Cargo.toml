[package]
name = "ajd"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[features]
experimental-time = ["js8rs/experimental-time"]

[dependencies]
nusb = "0.2.7"
js8rs = { git = "https://github.com/liamsto/js8rs" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = { version = "0.4.4", default-features = false }
